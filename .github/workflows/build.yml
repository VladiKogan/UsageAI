name: Build

# Validation only. Releases stay manual: this workflow never publishes, tags,
# uploads artifacts, or writes to the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UsageAI.sln

      - name: Build
        run: dotnet build UsageAI.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project UsageAI.Tests/UsageAI.Tests.csproj -c Release --no-build
