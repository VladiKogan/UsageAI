name: Build

# Validation only. Releases stay manual: this workflow never publishes, tags,
# uploads artifacts, or writes to the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UsageAI.sln

      - name: Build
        run: dotnet build UsageAI.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project UsageAI.Tests/UsageAI.Tests.csproj -c Release --no-build
