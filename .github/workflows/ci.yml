name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\UsageAI.Tests\UsageAI.Tests.csproj --locked-mode
          dotnet restore .\UsageAI.csproj -r win-x64 --locked-mode -p:NuGetLockFilePath=packages.win-x64.lock.json

      - name: Build application
        shell: pwsh
        run: dotnet build .\UsageAI.csproj -c Release --no-restore

      - name: Build security tests
        shell: pwsh
        run: dotnet build .\UsageAI.Tests\UsageAI.Tests.csproj -c Release --no-restore

      - name: Run security tests
        shell: pwsh
        run: dotnet run --project .\UsageAI.Tests\UsageAI.Tests.csproj -c Release --no-build

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $packageReferences = Get-ChildItem -Filter *.csproj -Recurse |
            Select-String -Pattern '<PackageReference\b'
          if ($packageReferences) {
            dotnet list .\UsageAI.csproj package --vulnerable --include-transitive
            if ($LASTEXITCODE -ne 0) {
              throw 'The NuGet vulnerability audit failed.'
            }
          }
          else {
            Write-Host 'No NuGet package references are present.'
          }

      - name: Verify publish output
        shell: pwsh
        run: |
          dotnet publish .\UsageAI.csproj -c Release --no-restore -r win-x64 --self-contained false -p:PublishSingleFile=true -p:NuGetLockFilePath=packages.win-x64.lock.json -o .\artifacts\publish
          if (!(Test-Path -LiteralPath .\artifacts\publish\UsageAI.exe)) {
            throw 'UsageAI.exe was not published.'
          }
          if (Get-ChildItem -LiteralPath .\artifacts\publish -Filter *.pdb) {
            throw 'Release output must not contain debug symbols.'
          }
          $publishedFiles = @(Get-ChildItem -LiteralPath .\artifacts\publish -File)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -cne 'UsageAI.exe') {
            throw 'Release publish output must contain only the single-file UsageAI.exe.'
          }
          [xml] $project = Get-Content -LiteralPath .\UsageAI.csproj -Raw
          $binaryFormatter = $project.SelectSingleNode('/Project/PropertyGroup/EnableUnsafeBinaryFormatterSerialization')
          if ($null -eq $binaryFormatter -or $binaryFormatter.InnerText -cne 'false') {
            throw 'Unsafe BinaryFormatter compatibility is not explicitly disabled.'
          }

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: UsageAI-unsigned-ci-${{ github.sha }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 7
